server:
  port: 8082 
spring:
  application:
    name: inventory-service 
  datasource:
    url: jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:  
  jpa:
    hibernate: 
      ddl-auto: update
      open-in-view: false
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  management:
    endpoints:
      web:
        exposure:
          include: health, info
  logging:
    level:
      org.springdoc: DEBUG
      org.springframework.web: INFO
common:
  observability:
    exec-time:
      enabled:true
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSSS} [%thread] %-5level %logger{36} - [%X{correlationId}] %msg%n"
